name: daily-video
on:
  schedule:
    - cron: "13 0 * * *"
    - cron: "43 1 * * *"
    - cron: "23 3 * * *"
  workflow_dispatch:
concurrency: autotube
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libraqm0
          pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          VIDEO_LANG: ${{ vars.VIDEO_LANG }}
      - if: always()
        run: |
          touch last_run.txt
          git add history.txt last_run.txt
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -m "update history" || true
          git push
