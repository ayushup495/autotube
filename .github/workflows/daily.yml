name: daily-video
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libraqm0
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          NICHE: ${{ vars.NICHE }}
          VIDEO_LANG: ${{ vars.VIDEO_LANG }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.txt
          git commit -m "update history" || true
          git push
